<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="r-grad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="14" y1="14" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Clean rounded icon container -->
  <rect width="48" height="48" rx="12" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#E2E8F0"/>

  <!-- Minimalist Monogram: Precision Acoustic Waves forming abstract R mark -->
  <!-- Stem -->
  <rect x="12" y="12" width="5" height="24" rx="2.5" fill="url(#r-grad)"/>
  
  <!-- Upper Loop / Wave -->
  <path d="M17 14.5C17 14.5 22 13 26 15C29.5 16.7 31 20 29.5 23.5C28 27 23.5 27.5 17 27.5" stroke="url(#r-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Lower Leg / Harmonic Sound Wave -->
  <path d="M23 26.5L31 35.5" stroke="url(#r-grad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Subtle Resonance Dot -->
  <circle cx="34.5" cy="15.5" r="2.5" fill="#0284C7"/>
</svg>